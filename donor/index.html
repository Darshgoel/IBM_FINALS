<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoodBridge — Donor Portal</title>
  <meta name="description" content="FoodBridge Donor Portal — Post surplus food and let the network handle the rest." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #070B14;
      --surface:  #0D1321;
      --card:     rgba(255,255,255,0.04);
      --border:   rgba(255,255,255,0.08);
      --primary:  #F59E0B;
      --primary-d:#D97706;
      --green:    #10B981;
      --red:      #EF4444;
      --text:     #F9FAFB;
      --muted:    #9CA3AF;
      --sub:      #6B7280;
      --radius:   14px;
      --font:     'Inter', sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse 80% 60% at 20% 20%, rgba(245,158,11,0.07) 0%, transparent 60%),
                  radial-gradient(ellipse 60% 50% at 80% 80%, rgba(16,185,129,0.06) 0%, transparent 60%);
      pointer-events: none;
    }

    .page {
      position: relative; z-index: 1;
      width: 100%; max-width: 440px;
      padding: 24px;
    }

    .logo {
      text-align: center;
      margin-bottom: 40px;
    }
    .logo-mark {
      font-size: 2.8rem;
      margin-bottom: 8px;
    }
    .logo h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--primary), #FCD34D);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo p {
      color: var(--muted);
      font-size: 0.875rem;
      margin-top: 6px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(20px);
      padding: 32px;
    }

    .tabs {
      display: flex;
      gap: 4px;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-family: var(--font);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #000;
      font-weight: 600;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select, textarea {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 16px;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(245,158,11,0.12);
    }
    select option { background: #1a1a2e; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .section-title {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 20px 0 12px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .section-title:first-of-type { margin-top: 0; border-top: none; padding-top: 0; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-d));
      color: #000;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(245,158,11,0.3); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .error-msg {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #FCA5A5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }
    .error-msg.show { display: block; }

    .success-msg {
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.3);
      color: #6EE7B7;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }
    .success-msg.show { display: block; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: inline-block; vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .pending-notice {
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.2);
      border-radius: 10px;
      padding: 16px;
      margin-top: 20px;
      text-align: center;
      display: none;
    }
    .pending-notice.show { display: block; }
    .pending-notice p { color: var(--muted); font-size: 0.85rem; line-height: 1.6; }
    .pending-notice strong { color: var(--primary); }
  </style>
</head>
<body>
  <div class="page">
    <div class="logo">
      <div class="logo-mark">🌉</div>
      <h1>FoodBridge</h1>
      <p>Donor Portal — Post once. We handle the rest.</p>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <!-- LOGIN -->
      <div class="tab-content active" id="content-login">
        <div class="error-msg" id="login-error"></div>
        <label for="login-email">Email Address</label>
        <input type="email" id="login-email" placeholder="you@organization.com" autocomplete="email" />
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
        <button class="btn btn-primary" id="login-btn" onclick="handleLogin()">Sign In</button>
      </div>

      <!-- REGISTER -->
      <div class="tab-content" id="content-register">
        <div class="error-msg" id="reg-error"></div>
        <div class="success-msg" id="reg-success"></div>

        <p class="section-title">Your Account</p>
        <label for="reg-name">Your Name</label>
        <input type="text" id="reg-name" placeholder="Full name" />
        <label for="reg-email">Email Address</label>
        <input type="email" id="reg-email" placeholder="you@organization.com" />
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" placeholder="Min. 8 characters" />

        <p class="section-title">Organization Details</p>
        <label for="reg-org-name">Organization Name</label>
        <input type="text" id="reg-org-name" placeholder="Restaurant / Hotel / Catering Co." />
        <label for="reg-org-type">Organization Type</label>
        <select id="reg-org-type">
          <option value="restaurant">Restaurant</option>
          <option value="hotel">Hotel / Hospitality</option>
          <option value="caterer">Caterer / Event Organizer</option>
          <option value="retailer">Supermarket / Retailer</option>
          <option value="institution">Institution / Canteen</option>
          <option value="other_donor">Other</option>
        </select>
        <label for="reg-address">Location Address</label>
        <input type="text" id="reg-address" placeholder="Street, City" />
        <div class="form-row">
          <div>
            <label for="reg-phone">Contact Phone</label>
            <input type="tel" id="reg-phone" placeholder="+91 98765 43210" />
          </div>
          <div>
            <label for="reg-hours">Operating Hours</label>
            <input type="text" id="reg-hours" placeholder="8am – 10pm" />
          </div>
        </div>

        <button class="btn btn-primary" id="reg-btn" onclick="handleRegister()">Create Account</button>

        <div class="pending-notice" id="pending-notice">
          <p>✅ Account created! <strong>Your organization is pending verification.</strong><br/>
          Our team will review and approve your account. You'll receive an email once verified and can then start posting surplus.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:3000/api';

    function switchTab(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('content-login').classList.toggle('active', tab === 'login');
      document.getElementById('content-register').classList.toggle('active', tab === 'register');
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.add('show');
    }
    function hideError(id) { document.getElementById(id).classList.remove('show'); }
    function showSuccess(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.add('show');
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.innerHTML = loading ? '<span class="spinner"></span> Please wait…' : btn.dataset.label;
    }

    document.getElementById('login-btn').dataset.label = 'Sign In';
    document.getElementById('reg-btn').dataset.label = 'Create Account';

    async function handleLogin() {
      hideError('login-error');
      const email    = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      if (!email || !password) return showError('login-error', 'Please enter email and password.');

      setLoading('login-btn', true);
      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        if (data.user.role !== 'donor') {
          throw new Error('This portal is for donors only. Please use the correct portal.');
        }
        localStorage.setItem('fb_token', data.token);
        localStorage.setItem('fb_user', JSON.stringify(data.user));
        window.location.href = '/donor/dashboard.html';
      } catch (err) {
        showError('login-error', err.message);
      } finally {
        setLoading('login-btn', false);
      }
    }

    async function handleRegister() {
      hideError('reg-error');
      const name    = document.getElementById('reg-name').value.trim();
      const email   = document.getElementById('reg-email').value.trim();
      const password= document.getElementById('reg-password').value;
      const orgName = document.getElementById('reg-org-name').value.trim();
      const orgType = document.getElementById('reg-org-type').value;
      const address = document.getElementById('reg-address').value.trim();
      const phone   = document.getElementById('reg-phone').value.trim();
      const hours   = document.getElementById('reg-hours').value.trim();

      if (!name || !email || !password || !orgName) {
        return showError('reg-error', 'Name, email, password and organization name are required.');
      }
      if (password.length < 8) return showError('reg-error', 'Password must be at least 8 characters.');

      setLoading('reg-btn', true);
      try {
        const res = await fetch(`${API}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role: 'donor', orgName, orgType, locationAddress: address, contactPhone: phone, operatingHours: hours })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        document.getElementById('pending-notice').classList.add('show');
        showSuccess('reg-success', 'Registration successful!');
      } catch (err) {
        showError('reg-error', err.message);
      } finally {
        setLoading('reg-btn', false);
      }
    }

    // Auto-redirect if already logged in
    const token = localStorage.getItem('fb_token');
    const user  = JSON.parse(localStorage.getItem('fb_user') || 'null');
    if (token && user && user.role === 'donor') {
      window.location.href = '/donor/dashboard.html';
    }

    // Enter key support
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const loginActive = document.getElementById('content-login').classList.contains('active');
        if (loginActive) handleLogin();
        else handleRegister();
      }
    });
  </script>
</body>
</html>
